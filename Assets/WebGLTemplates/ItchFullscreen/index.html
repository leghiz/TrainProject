<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #unity-container { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { display: block; background: #000; outline: none; image-rendering: pixelated; image-rendering: crisp-edges; }
    #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40%; max-width: 420px; height: 8px; background: #2a1a14; border: 2px solid #5a3a2c; }
    #loading-fill { height: 100%; width: 0; background: #ff9500; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-fill"></div></div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var ratio = {{{ WIDTH }}} / {{{ HEIGHT }}};

    // Canvas fills the window (itch frame or itch fullscreen) and keeps 16:9, black bars around.
    function fit() {
      var w = window.innerWidth, h = window.innerHeight;
      var cw = w, ch = Math.round(w / ratio);
      if (ch > h) { ch = h; cw = Math.round(h * ratio); }
      canvas.style.width = cw + "px";
      canvas.style.height = ch + "px";
    }
    window.addEventListener("resize", fit);
    fit();

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: window.devicePixelRatio || 1
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#loading-fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });
  </script>
</body>
</html>
